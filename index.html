<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voli Tournament</title>

<style>
:root{
  --red:#fe1b0a;
  --blue:#215aa8;
  --silver:#c9cdd2;
  --dark:#11151d;
  --panel:#171a20
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:#11151d
}

body{
  background:#fff url("https://raw.githubusercontent.com/ssekartadji5/Paragon-Sport-Community-Cup-Plant-2026-Voli/main/VOLLEY.png") center/cover fixed no-repeat;
  color:#111;
  font-family:Inter,Arial,sans-serif;
  margin:0;
  overflow-x:auto
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://raw.githubusercontent.com/ssekartadji5/Paragon-Sport-Community-Cup-Plant-2026-Voli/main/VOLLEY.png") center/cover fixed no-repeat;
  opacity:1;
  z-index:-1;
  pointer-events:none
}

.app{
  position:relative;
  z-index:1
}

body:before{
  display:none!important
}

.app:before{
  display:none
}

header{
  position:relative;
  z-index:2;
  padding:18px 28px;
  border-bottom:2px solid #ffffffaa;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  background:#11151dea;
  color:#fff
}
.header-brand{
  display:flex;
  align-items:center;
  gap:22px;
  min-width:0
}
.header-logo{
  display:block;
  width:150px;
  max-height:66px;
  object-fit:contain;
  padding-left:20px;
  border-left:1px solid #ffffff66
}

h1{
  margin:0;
  font-size:24px;
  letter-spacing:1px
}

header small{
  color:#c8ccd4
}

.live{
  margin-left:auto;
  background:var(--red);
  padding:7px 12px;
  border-radius:999px;
  font-weight:800
}

.mode{
  display:flex;
  gap:6px;
  margin-left:auto;
  margin-right:8px
}

.mode button{
  background:#2a3039;
  color:#fff;
  border:1px solid #ffffff33;
  border-radius:6px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
  cursor:pointer
}

.mode button.active{
  background:var(--red);
  border-color:var(--red)
}

#adminMode{
  font-size:0;
  width:38px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  margin-left:4px
}

#adminMode:after{
  content:"⚙";
  font-size:20px;
  line-height:1
}

.wrap{
  position:relative;
  z-index:1;
  padding:22px 24px
}

.hero{
  text-align:center;
  margin-bottom:16px
}

.eyebrow{
  font-size:11px;
  color:#4f555d;
  letter-spacing:2px;
  font-weight:800
}

.hero h2{
  font-size:34px;
  margin:4px 0
}

.hero p{
  margin:0;
  color:#555b64
}

.board{
  background:rgba(255,255,255,.72);
  border:2px solid #ffffffaa;
  border-radius:6px;
  padding:18px;
  overflow:hidden;
  box-shadow:0 18px 50px #0004
}

.rounds{
  display:flex;
  gap:10px;
  width:100%;
  height:650px;
  padding:18px 10px;
  overflow:hidden
}

.round{
  position:relative;
  display:flex;
  flex:1 1 0;
  min-width:0;
  flex-direction:column;
  height:100%;
  padding-top:30px;
  justify-content:space-around
}

.round h3{
  position:absolute;
  top:0;
  left:0;
  right:0;
  margin:0;
  color:#333840;
  font-size:10px;
  letter-spacing:1.4px;
  text-align:center;
  white-space:nowrap;
  font-weight:900
}

.round.center{
  justify-content:center;
  padding-top:0
}

.round.center h3{
  color:var(--red)
}

.match{
  position:relative;
  background:linear-gradient(145deg,#353a42,#171a20);
  border:1px solid #8f969f;
  border-radius:5px;
  padding:6px;
  box-shadow:0 6px 15px #0007;
  margin:0 0 26px
}

.left .match{
  border-left:3px solid var(--red)
}

.right .match{
  border-right:3px solid var(--blue)
}

.match:after{
  position:absolute;
  left:0;
  right:0;
  bottom:-18px;
  text-align:center;
  color:#343a42;
  font-size:8px;
  font-weight:900;
  letter-spacing:.8px
}

.match[data-match="R1"]:after{content:"MATCH 01"}
.match[data-match="R2"]:after{content:"MATCH 02"}
.match[data-match="R3"]:after{content:"MATCH 03"}
.match[data-match="R4"]:after{content:"MATCH 04"}
.match[data-match="R5"]:after{content:"MATCH 05"}
.match[data-match="R6"]:after{content:"MATCH 06"}
.match[data-match="R7"]:after{content:"MATCH 07"}
.match[data-match="R8"]:after{content:"MATCH 08"}
.match[data-match="Q1"]:after{content:"MATCH 09"}
.match[data-match="Q2"]:after{content:"MATCH 10"}
.match[data-match="Q3"]:after{content:"MATCH 11"}
.match[data-match="Q4"]:after{content:"MATCH 12"}
.match[data-match="S1"]:after{content:"MATCH 13"}
.match[data-match="S2"]:after{content:"MATCH 14"}
.match.women-match[data-match="S1"]:after{content:"MATCH 01"}
.match.women-match[data-match="S2"]:after{content:"MATCH 02"}
.match.women-match[data-match="F"]:after{content:"MATCH 03"}
.match[data-match="F"]:after{content:"MATCH 15"}
.match[data-match="T"]:after{content:"MATCH 16"}

.left .match:not(:last-child):before,
.right .match:not(:last-child):before{
  display:none!important
}

.team{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 7px;
  background:#59616d;
  color:#fff;
  border-radius:3px;
  margin:2px 0;
  min-height:27px;
  font-size:10px;
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden
}

.match .team:first-child{background:#4b3c3d}
.match .team:nth-child(2){background:#59616d}
.team.win{
  border-left:3px solid var(--red);
  background:#4b3b3d
}

.score{
  font-weight:900;
  margin-left:5px;
  color:#fff
}

.status{
  font-size:7px;
  color:#c9cdd2;
  margin-top:4px
}

.early .score{
  display:none
}

.grandbox,
.thirdbox{
  border-radius:7px;
  padding:8px
}

.grandbox{
  background:linear-gradient(145deg,#f1f2f3,#c8ccd1);
  border:3px solid var(--red);
  color:#111;
  box-shadow:0 10px 25px #0005
}

.thirdbox{
  margin-top:14px;
  background:#111722;
  border:2px solid #e4a900;
  color:#fff
}

.grandtitle{
  background:var(--red);
  color:#fff;
  border-radius:4px;
  padding:5px;
  font-size:10px;
  font-weight:900
}

.gteam{
  display:flex;
  justify-content:space-between;
  background:#fff;
  margin-top:5px;
  padding:7px 6px;
  border-radius:3px;
  font-size:10px;
  font-weight:800
}

.thirdbox .gteam{
  color:#111
}

.champ{
  margin-top:7px;
  background:#111722;
  color:#ffcc33;
  border-radius:4px;
  padding:7px;
  font-size:10px;
  font-weight:900
}

.admin-only{
  margin-top:22px;
  background:#090b10e8;
  border:1px solid #ffffff18;
  border-radius:16px;
  padding:20px;
  color:#fff
}

.team-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(110px,1fr));
  gap:8px
}

.team-grid input,
.controls input,
.controls select{
  background:#151922;
  color:#fff;
  border:1px solid #ffffff25;
  border-radius:7px;
  padding:10px
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px
}

.score-entry-wrap{overflow-x:auto;max-width:100%}
.score-entry-table{border-collapse:separate;border-spacing:4px;width:auto;color:#fff;font-size:12px}
.score-entry-table th{padding:7px 9px;text-align:center;white-space:nowrap;color:#c9cdd2;font-size:10px;text-transform:uppercase}
.score-entry-table tbody th{text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis;color:#fff;text-transform:none;font-size:12px}
.score-entry-table td{padding:0}
.score-entry-table input{width:66px;min-width:66px;text-align:center;padding:9px 5px}
.score-entry-table input::-webkit-inner-spin-button,.score-entry-table input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.score-entry-table input[type=number]{-moz-appearance:textfield}
.score-grid{width:100%;margin:0;border-collapse:separate;border-spacing:0;table-layout:fixed;background:#282b31;color:#fff;font-size:10px}
.score-grid td{padding:7px 5px;text-align:center;border:0;height:22px;background:#59616d;color:#fff}
.score-grid tr:first-child td{background:#4b3c3d}
.score-grid tr+tr td{border-top:3px solid #282b31}
.score-grid td:first-child{text-align:left;width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-grid td+td{border-left:0}
.score-grid .set-empty{color:#aeb4bd}
.scored-match{padding:8px!important;background:#282b31!important;border:2px solid #282b31!important;border-left:3px solid #FE1B0A!important;border-radius:6px!important;box-shadow:0 8px 14px #0005!important;overflow:visible}
.scored-match:after{display:block!important;position:absolute!important;left:0!important;right:0!important;bottom:-18px!important;text-align:center!important;content:attr(data-match)!important;color:#343a42!important;font-size:8px!important;font-weight:900!important;letter-spacing:.8px!important}
.scored-match[data-match="R1"]:after{content:"MATCH 01"!important}
.scored-match[data-match="R2"]:after{content:"MATCH 02"!important}
.scored-match[data-match="R3"]:after{content:"MATCH 03"!important}
.scored-match[data-match="R4"]:after{content:"MATCH 04"!important}
.scored-match[data-match="R5"]:after{content:"MATCH 05"!important}
.scored-match[data-match="R6"]:after{content:"MATCH 06"!important}
.scored-match[data-match="R7"]:after{content:"MATCH 07"!important}
.scored-match[data-match="R8"]:after{content:"MATCH 08"!important}
.scored-match[data-match="Q1"]:after{content:"MATCH 09"!important}
.scored-match[data-match="Q2"]:after{content:"MATCH 10"!important}
.scored-match[data-match="Q3"]:after{content:"MATCH 11"!important}
.scored-match[data-match="Q4"]:after{content:"MATCH 12"!important}
.scored-match[data-match="S1"]:after{content:"MATCH 13"!important}
.scored-match[data-match="S2"]:after{content:"MATCH 14"!important}
.scored-match.women-match[data-match="S1"]:after{content:"MATCH 01"!important}
.scored-match.women-match[data-match="S2"]:after{content:"MATCH 02"!important}
.scored-match[data-match="F"]:after{content:"MATCH 15"!important}
.scored-match[data-match="T"]:after{content:"MATCH 16"!important}

.btn{
  background:var(--red);
  color:#fff;
  border:0;
  border-radius:7px;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer
}

.btn.blue{
  background:var(--blue)
}

.note{
  margin-top:14px;
  color:#aeb4c0;
  font-size:12px
}

.is-tv .admin-only{
  display:none
}

.is-tv header{
  padding:12px 24px
}

.is-tv .wrap{
  padding:12px 16px
}

.is-tv .hero{
  margin-bottom:8px
}

.is-tv .hero h2{
  font-size:28px
}

.is-tv .rounds{
  height:calc(100vh - 150px)
}

@media(max-width:700px){
  header{
    padding:14px 16px;
    flex-wrap:wrap;
    gap:12px
  }
  .header-brand{
    flex:1 1 100%;
    justify-content:space-between;
    gap:12px
  }
  .header-logo{
    width:100px;
    max-height:48px;
    padding-left:12px
  }
  h1{font-size:19px}
  .mode{margin-left:0}


  .wrap{
    padding:16px
  }

  .hero h2{
    font-size:26px
  }

  .rounds{
    min-width:1160px
  }

  .team-grid{
    grid-template-columns:repeat(2,minmax(110px,1fr))
  }

}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<main class="app">

<header>

<div class="header-brand">
  <div>
    <h1>Sport Community Cup Plant - 2026</h1>
    <small>
      PARAGON SPORT COMMUNITY •
      <span id="gameHeader">Voli Putra</span>
    </small>
  </div>
  <img
    class="header-logo"
    src="https://raw.githubusercontent.com/ssekartadji5/Paragon-Sport-Community-Cup-Plant-2026-Voli/main/Logo%20Paragon%20Sport%20Community%20Cup%20-%20White%20(1).png"
    alt="Paragon Sport Community Cup 2026"
  >
</div>

<div class="mode">
<button type="button" id="menMode" class="active">VOLI PUTRA</button>
<button type="button" id="womenMode">VOLI PUTRI</button>
</div>

<div class="live" id="liveBadge" style="display:none">
LIVE
</div>

<button
type="button"
id="adminMode"
aria-label="Buka Admin Control"
title="Admin Settings">
ADMIN
</button>

</header>

<div class="wrap">

<section class="hero">
<h2>
<span id="gameTitle">VOLI PUTRA</span> - ROUND OF 16
</h2>
</section>

<section class="board">
<div class="rounds" id="bracket"></div>
</section>

<section class="admin-only">

<div class="eyebrow">ADMIN CONTROL</div>

<h3 style="margin:6px 0">
TOURNAMENT SETUP
</h3>

<div class="team-grid" id="teamInputs"></div>

<div class="controls">

<button type="button" class="btn" id="generate">
GENERATE BRACKET
</button>

<button class="btn blue" id="reset">
RESET
</button>

</div>

<div class="controls">

<select id="matchSelect"></select>

<div class="score-entry-wrap">
 <table class="score-entry-table">
  <thead><tr><th>Tim</th><th>Set 1</th><th>Set 2</th><th>Set 3</th></tr></thead>
  <tbody>
   <tr><th id="scoreTeamA">Tim A</th><td><input id="s1a" type="number" min="0" max="99" inputmode="numeric" aria-label="Poin Tim A Set 1"></td><td><input id="s2a" type="number" min="0" max="99" inputmode="numeric" aria-label="Poin Tim A Set 2"></td><td><input id="s3a" type="number" min="0" max="99" inputmode="numeric" aria-label="Poin Tim A Set 3"></td></tr>
   <tr><th id="scoreTeamB">Tim B</th><td><input id="s1b" type="number" min="0" max="99" inputmode="numeric" aria-label="Poin Tim B Set 1"></td><td><input id="s2b" type="number" min="0" max="99" inputmode="numeric" aria-label="Poin Tim B Set 2"></td><td><input id="s3b" type="number" min="0" max="99" inputmode="numeric" aria-label="Poin Tim B Set 3"></td></tr>
  </tbody>
 </table>
</div>
<button class="btn" id="saveScore">SIMPAN SKOR</button>

</div>

<div class="note">
Best of 3: Set 1–2 sampai 25 poin, Set 3 (jika diperlukan) sampai 15 poin. Menang wajib selisih minimal 2 poin.
</div>

</section>

</div>

</main>

<script>
(function(){
const $=id=>document.getElementById(id);
let women=false;
let menTeams=Array(14).fill(""),womenTeams=Array(4).fill(""),matches={};
const SUPABASE_URL="https://tyuswzuswdhavbrtuzzd.supabase.co";
const SUPABASE_KEY="sb_publishable_o_y4SJPaiNhjtrt5y-ruNA_izK0V7Bu";
let supabase=null,realtimeChannel=null,womenDraftDirty=false,womenGenerateInProgress=false;
try{if(window.supabase&&window.supabase.createClient)supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){console.warn(e)}

function match(a="",b="",id=""){
 const m=matches[id],sa=m&&m.sa!==undefined?m.sa:"",sb=m&&m.sb!==undefined?m.sb:"";
 const wa=m&&m.winner===a?" win":"",wb=m&&m.winner===b?" win":"";
 const n=id&&id[0]==="R"?parseInt(id.slice(1)):0;
 const la=v=>v||(women&&(id==="S1"||id==="S2")?"TBD":(n?"Tim "+(n*2-1):"TBD"));
 const lb=v=>v||(women&&(id==="S1"||id==="S2")?"TBD":(n?"Tim "+(n*2):"TBD"));
 const wc=women&&(id==="S1"||id==="S2"||id==="F")?" women-match":"";
 const hasScores=m&&[m.set1a,m.set1b,m.set2a,m.set2b,m.set3a,m.set3b].some(v=>v!==null&&v!==undefined&&v!=="");
 const scoreTable=hasScores?'<table class="score-grid"><tbody><tr><td title="'+la(a)+'">'+la(a)+'</td><td>'+scoreCell(m.set1a)+'</td><td>'+scoreCell(m.set2a)+'</td><td>'+scoreCell(m.set3a)+'</td></tr><tr><td title="'+lb(b)+'">'+lb(b)+'</td><td>'+scoreCell(m.set1b)+'</td><td>'+scoreCell(m.set2b)+'</td><td>'+scoreCell(m.set3b)+'</td></tr></tbody></table>':'';
 if(hasScores)return '<div class="match'+wc+' scored-match" data-match="'+id+'">'+scoreTable+'</div>';
 return '<div class="match'+wc+'" data-match="'+id+'"><div class="team'+wa+'">'+la(a)+(sa!==""?'<span class="score">'+sa+' set</span>':"")+'</div><div class="team'+wb+'">'+lb(b)+(sb!==""?'<span class="score">'+sb+' set</span>':"")+'</div></div>';
}
function scoreCell(v){return v===null||v===undefined||v===""?'<span class="set-empty">–</span>':v}
function initMen(){
 matches={};
 for(let i=1;i<=8;i++)matches["R"+i]={a:"",b:"",winner:"",sa:undefined,sb:undefined,round:"R16"};
 for(let i=1;i<=4;i++)matches["Q"+i]={a:"",b:"",winner:"",sa:undefined,sb:undefined,round:"QF"};
 for(let i=1;i<=2;i++)matches["S"+i]={a:"",b:"",winner:"",sa:undefined,sb:undefined,round:"SF"};
 matches.F={a:"",b:"",winner:"",sa:undefined,sb:undefined,round:"FINAL"};
 matches.T={a:"",b:"",winner:"",sa:undefined,sb:undefined,round:"THIRD PLACE"};
 const t=menTeams.slice();
 const slots=[t[0],"BYE",t[1],t[2],t[3],t[4],t[5],t[6],t[7],t[8],t[9],t[10],t[11],t[12],t[13],"BYE"];
 for(let i=0;i<8;i++){
  matches["R"+(i+1)].a=slots[i*2];matches["R"+(i+1)].b=slots[i*2+1];
  if(slots[i*2]==="BYE")matches["R"+(i+1)].winner=slots[i*2+1];
  if(slots[i*2+1]==="BYE")matches["R"+(i+1)].winner=slots[i*2];
 }
 // A team facing BYE advances automatically into its quarter-final slot.
 for(let i=0;i<4;i++){
  const left=matches["R"+(i*2+1)],right=matches["R"+(i*2+2)],q=matches["Q"+(i+1)];
  if(left.winner)q.a=left.winner;
  if(right.winner)q.b=right.winner;
 }
}
function initWomen(){
 matches={
  S1:{a:womenTeams[0]||"Tim 1",b:womenTeams[1]||"Tim 2",winner:"",sa:undefined,sb:undefined,round:"SF"},
  S2:{a:womenTeams[2]||"Tim 3",b:womenTeams[3]||"Tim 4",winner:"",sa:undefined,sb:undefined,round:"SF"},
  F:{a:"",b:"",winner:"",sa:undefined,sb:undefined,round:"FINAL"}
 };
}
function card(id){const m=matches[id];return match(m.a,m.b,id)}
function renderMen(){
 const gameTitleEl=$("gameTitle"),gameHeaderEl=$("gameHeader"),heroTitleEl=document.querySelector(".hero h2");
 if(gameTitleEl)gameTitleEl.textContent="VOLI PUTRA";
 if(gameHeaderEl)gameHeaderEl.textContent="Voli Putra";
 if(heroTitleEl)heroTitleEl.textContent="VOLI PUTRA - ROUND OF 16";
 $("bracket").innerHTML=
 '<div class="round left"><h3>ROUND OF 16</h3>'+card("R1")+card("R2")+card("R3")+card("R4")+'</div>'+
 '<div class="round left"><h3>QUARTER FINAL</h3>'+card("Q1")+card("Q2")+'</div>'+
 '<div class="round left"><h3>SEMIFINAL</h3>'+card("S1")+'</div>'+
 '<div class="round center"><h3>GRAND FINAL</h3><div class="grandbox"><div class="grandtitle">GRAND FINAL</div>'+
 match(matches.F.a,matches.F.b,"F")+'<div class="champ">JUARA 1 • '+(matches.F.winner||"TBD")+'</div></div>'+
 '<div class="thirdbox"><div class="grandtitle">THIRD PLACE</div>'+match(matches.T.a,matches.T.b,"T")+
 '<div class="champ">JUARA 3 • '+(matches.T.winner||"TBD")+'</div></div></div>'+
 '<div class="round right"><h3>SEMIFINAL</h3>'+card("S2")+'</div>'+
 '<div class="round right"><h3>QUARTER FINAL</h3>'+card("Q3")+card("Q4")+'</div>'+
 '<div class="round right"><h3>ROUND OF 16</h3>'+card("R5")+card("R6")+card("R7")+card("R8")+'</div>';
}
function syncWomenFinal(){
 if(!matches.S1||!matches.S2||!matches.F)return;
 const finalA=matches.S1.winner||"",finalB=matches.S2.winner||"";
 if(matches.F.a!==finalA||matches.F.b!==finalB){
  matches.F.a=finalA;matches.F.b=finalB;
  matches.F.winner="";matches.F.sa=undefined;matches.F.sb=undefined;
  matches.F.set1a=matches.F.set1b=matches.F.set2a=matches.F.set2b=matches.F.set3a=matches.F.set3b=undefined;
 }
}
function renderWomen(){
 if(!matches.S1||!matches.S2||!matches.F)initWomen();
 // Read Admin Control directly before painting the bracket, avoiding stale
 // async database/realtime state replacing the visible team names.
 const inputEls=[...document.querySelectorAll("#teamInputs input")];
 if(inputEls.length===4){
  const inputNames=inputEls.map(el=>el.value.trim());
  if(inputNames.some(Boolean))womenTeams=inputNames;
 }
 matches.S1.a=(womenTeams[0]||"").trim()||"Tim 1";
 matches.S1.b=(womenTeams[1]||"").trim()||"Tim 2";
 matches.S2.a=(womenTeams[2]||"").trim()||"Tim 3";
 matches.S2.b=(womenTeams[3]||"").trim()||"Tim 4";
 syncWomenFinal();
 const gameTitleEl=$("gameTitle"),gameHeaderEl=$("gameHeader"),heroTitleEl=document.querySelector(".hero h2");
 if(gameTitleEl)gameTitleEl.textContent="VOLI PUTRI";
 if(gameHeaderEl)gameHeaderEl.textContent="Voli Putri";
 if(heroTitleEl)heroTitleEl.textContent="VOLI PUTRI";
 $("bracket").innerHTML=
 '<div class="round left">'+card("S1")+card("S2")+'</div>'+
 '<div class="round center"><h3>GRAND FINAL</h3><div class="grandbox"><div class="grandtitle">GRAND FINAL</div>'+
 match(matches.F.a,matches.F.b,"F")+'<div class="champ">JUARA 1 • '+(matches.F.winner||"TBD")+'</div></div></div>';
}
function buildInputs(){
 const count=women?4:14,data=women?womenTeams:menTeams;
 $("teamInputs").innerHTML=Array.from({length:count},(_,i)=>'<input data-team="'+i+'" placeholder="Tim '+(i+1)+'" value="'+(data[i]||"").replace(/"/g,"&quot;")+'">').join("");
 document.querySelectorAll("#teamInputs input").forEach(x=>x.oninput=()=>{
  const d=[...document.querySelectorAll("#teamInputs input")].map(x=>x.value.trim());
  if(women){
   womenTeams=d.slice(0,4);
   womenDraftDirty=true;
   if(!matches.S1||!matches.S2||!matches.F)initWomen();
   renderWomen();
   buildMatchSelect();
  }else menTeams=d;
 });
}
function saveInputs(){
 const d=[...document.querySelectorAll("#teamInputs input")].map(x=>x.value.trim());
 if(women)womenTeams=d;else menTeams=d;
}
function matchNumber(id){if(women)return id==="S1"?1:id==="S2"?2:3;return {R1:1,R2:2,R3:3,R4:4,R5:5,R6:6,R7:7,R8:8,Q1:9,Q2:10,Q3:11,Q4:12,S1:13,S2:14,F:15,T:16}[id]||0}
function dbRows(){
 return Object.keys(matches).map(id=>{const m=matches[id];return{id:(women?"PUTRI-":"PUTRA-")+id,division:women?"PUTRI":"PUTRA",round:m.round,match_number:matchNumber(id),team_a:m.a||"",team_b:m.b||"",score_a:m.sa??0,score_b:m.sb??0,set1_a:m.set1a??null,set1_b:m.set1b??null,set2_a:m.set2a??null,set2_b:m.set2b??null,set3_a:m.set3a??null,set3_b:m.set3b??null,winner:m.winner||"",status:m.winner?"finished":"pending",updated_at:new Date().toISOString()}})
}
async function saveDbRows(ids){
 if(!supabase)return false;
 const rows=dbRows().filter(r=>!ids||ids.includes(r.id.split("-").slice(1).join("-")));
 if(!rows.length)return true;
 const {error}=await supabase.from("volleyball_matches").upsert(rows,{onConflict:"id"});
 if(error){console.error("Supabase save:",error);return false;}
 return true;
}
function applyDbRow(row,options={}){
 const prefix=row.division==="PUTRI"?"PUTRI-":"PUTRA-";
 if(!row.id.startsWith(prefix))return;
 const id=row.id.slice(prefix.length);
 if(!matches[id])return;
 const protectWomenNames=!!options.protectWomenNames;
 if(!protectWomenNames){
  if(row.team_a)matches[id].a=row.team_a;
  if(row.team_b)matches[id].b=row.team_b;
 }
 if(row.score_a!==null&&row.score_a!==undefined&&row.winner)matches[id].sa=row.score_a;
 if(row.score_b!==null&&row.score_b!==undefined&&row.winner)matches[id].sb=row.score_b;
 ["set1_a","set1_b","set2_a","set2_b","set3_a","set3_b"].forEach(k=>{
  const key=k.replace("_","").replace("_","");
  if(row[k]!==null&&row[k]!==undefined)matches[id][key]=row[k];
 });
 if(row.winner)matches[id].winner=row.winner;
 if(row.division==="PUTRA"&&/^R[1-8]$/.test(id)){
  // Rebuild Admin inputs in their original order, not bracket-slot order.
  const inputSlots={
   R1:[0,null],R2:[1,2],R3:[3,4],R4:[5,6],
   R5:[7,8],R6:[9,10],R7:[11,12],R8:[13,null]
  }[id];
  if(inputSlots){
   if(inputSlots[0]!==null&&row.team_a)menTeams[inputSlots[0]]=row.team_a;
   if(inputSlots[1]!==null&&row.team_b&&row.team_b!=="BYE")menTeams[inputSlots[1]]=row.team_b;
  }
 }
 if(row.division==="PUTRI"&&(id==="S1"||id==="S2")&&!protectWomenNames){
  const n=id==="S1"?0:2;
  if(row.team_a)womenTeams[n]=row.team_a;
  if(row.team_b)womenTeams[n+1]=row.team_b;
 }
}
let modeSwitchVersion=0;
async function loadDb(){
 if(!supabase)return;
 const requestedWomen=women;
 const requestedVersion=modeSwitchVersion;
 const {data,error}=await supabase.from("volleyball_matches").select("*").eq("division",requestedWomen?"PUTRI":"PUTRA");
 if(error){console.error("Supabase load:",error);return}
 // Ignore late responses belonging to the division that is no longer selected.
 if(requestedVersion!==modeSwitchVersion||requestedWomen!==women)return;
 if(women&&womenDraftDirty)return;
 if(women){
  initWomen();
  // Restore semifinal team names from their exact database rows first.
  const sf1=data.find(row=>row.id==="PUTRI-S1");
  const sf2=data.find(row=>row.id==="PUTRI-S2");
  if(sf1){womenTeams[0]=sf1.team_a||"";womenTeams[1]=sf1.team_b||"";}
  if(sf2){womenTeams[2]=sf2.team_a||"";womenTeams[3]=sf2.team_b||"";}
  data.forEach(row=>applyDbRow(row,{protectWomenNames:true}));
  matches.S1.a=womenTeams[0]||"Tim 1";matches.S1.b=womenTeams[1]||"Tim 2";
  matches.S2.a=womenTeams[2]||"Tim 3";matches.S2.b=womenTeams[3]||"Tim 4";
  syncWomenFinal();
  renderWomen();
  buildInputs();
 }else{
  initMen();
  data.forEach(applyDbRow);
  renderMen();
  // Rebuild Admin Control inputs from the names restored from Supabase.
  buildInputs();
 }
 buildMatchSelect();
}
function startRealtime(){
 if(!supabase||realtimeChannel)return;
 realtimeChannel=supabase.channel("volleyball-live").on("postgres_changes",{event:"*",schema:"public",table:"volleyball_matches"},payload=>{
  if(payload.new&&payload.new.division==="PUTRI"){
   // Team names in the Putri bracket are controlled by Admin. Realtime may
   // deliver an older row after Generate, so never let realtime overwrite them.
   applyDbRow(payload.new,{protectWomenNames:true});
   if(women)renderWomen();else renderMen();
  }else{
   if(payload.new)applyDbRow(payload.new);
   if(women)renderWomen();else renderMen();
  }
  buildMatchSelect();
  $("liveBadge").style.display="block";
 }).subscribe(status=>{$("liveBadge").style.display=status==="SUBSCRIBED"?"block":"none"});
}
function setNextTeam(targetId,slot,name){
 const target=matches[targetId];if(!target)return false;
 const key=slot==="a"?"a":"b",nextName=name||"TBD";
 if(target[key]===nextName)return false;
 target[key]=nextName;
 target.winner="";target.sa=undefined;target.sb=undefined;
 target.set1a=target.set1b=target.set2a=target.set2b=target.set3a=target.set3b=undefined;
 return true;
}
function propagateMenResult(id){
 const affected=new Set([id]);
 const m=matches[id];if(!m)return [...affected];
 const winner=m.winner||"";
 const loser=winner?(winner===m.a?m.b:m.a):"";
 const links={
  R1:[["Q1","a"]],R2:[["Q1","b"]],
  R3:[["Q2","a"]],R4:[["Q2","b"]],
  R5:[["Q3","a"]],R6:[["Q3","b"]],
  R7:[["Q4","a"]],R8:[["Q4","b"]],
  Q1:[["S1","a"]],Q2:[["S1","b"]],
  Q3:[["S2","a"]],Q4:[["S2","b"]]
 };
 for(const [target,slot] of (links[id]||[])){
  if(setNextTeam(target,slot,winner))affected.add(target);
 }
 if(id==="S1"){
  if(setNextTeam("F","a",winner))affected.add("F");
  if(setNextTeam("T","a",loser))affected.add("T");
 }else if(id==="S2"){
  if(setNextTeam("F","b",winner))affected.add("F");
  if(setNextTeam("T","b",loser))affected.add("T");
 }
 // Persisted winner propagation must remain visible after refresh.
 return [...affected];
}
function matchLabel(id){
 const n=matchNumber(id);
 return "Match "+n;
}
function buildMatchSelect(){
 const ids=Object.keys(matches);
 const previous=$("matchSelect").value;
 $("matchSelect").innerHTML=ids.map(id=>{
  const m=matches[id];
  return '<option value="'+id+'">'+matchLabel(id)+' • '+m.round+'</option>';
 }).join("");
 const selected=ids.includes(previous)?previous:ids[0];
 if(selected)loadScore(selected);
}
function loadScore(id){
 const m=matches[id];if(!m)return;
 $("matchSelect").value=id;
 [["s1a","set1a"],["s1b","set1b"],["s2a","set2a"],["s2b","set2b"],["s3a","set3a"],["s3b","set3b"]].forEach(([input,key])=>{
  $(input).value=m[key]??"";
 });
 $("scoreTeamA").textContent=m.a||"TBD";
 $("scoreTeamB").textContent=m.b||"TBD";
}
async function generateBracket(){
 const data=[...document.querySelectorAll("#teamInputs input")].map(x=>x.value.trim());
 try{
  // Do not rely on a button lookup for core logic; the previous null button
  // reference could abort Generate before it updated the bracket.
  if(women){
   womenGenerateInProgress=true;
   womenDraftDirty=true;
   womenTeams=data.slice(0,4);
   initWomen();
   matches.S1.a=womenTeams[0]||"Tim 1";
   matches.S1.b=womenTeams[1]||"Tim 2";
   matches.S2.a=womenTeams[2]||"Tim 3";
   matches.S2.b=womenTeams[3]||"Tim 4";
   renderWomen();
  }else{
   menTeams=data.slice(0,14);
   initMen();
   renderMen();
  }
  buildInputs();
  buildMatchSelect();
  const ids=women?["S1","S2","F"]:["R1","R2","R3","R4","R5","R6","R7","R8","Q1","Q2","Q3","Q4"];
  const ok=await saveDbRows(ids);
  if(!ok){
   alert("Nama tim sudah diterapkan di layar, tetapi penyimpanan Supabase gagal. Periksa koneksi/database lalu coba lagi.");
   return;
  }
  if(women){
   womenTeams=data.slice(0,4);
   matches.S1.a=womenTeams[0]||"Tim 1";matches.S1.b=womenTeams[1]||"Tim 2";
   matches.S2.a=womenTeams[2]||"Tim 3";matches.S2.b=womenTeams[3]||"Tim 4";
   renderWomen();
   womenDraftDirty=false;
  }else{
   menTeams=data.slice(0,14);
  }
  buildInputs();
  buildMatchSelect();
  alert("Data Voli "+(women?"Putri":"Putra")+" telah terupdate.");
 }catch(err){
  console.error("Generate bracket error:",err);
  alert("Generate gagal dijalankan: "+(err&&err.message?err.message:"kesalahan tidak diketahui")+".");
 }finally{
  womenGenerateInProgress=false;
 }
}
async function saveScore(){
 const id=$("matchSelect").value,m=matches[id];if(!m)return;
 if(!m.a||!m.b||m.a==="BYE"||m.b==="BYE"||m.a==="TBD"||m.b==="TBD"){alert("Match ini belum memiliki dua tim.");return}
 const sets=[
  [ $("s1a").value, $("s1b").value ],
  [ $("s2a").value, $("s2b").value ],
  [ $("s3a").value, $("s3b").value ]
 ];
 const parsed=sets.map(pair=>pair.map(v=>v===""?null:Number(v)));
 if(parsed.some(pair=>pair.some(v=>v!==null&&(!Number.isInteger(v)||v<0||v>99)))){alert("Masukkan poin bulat antara 0–99.");return}
 if(parsed[0].every(v=>v===null)||parsed[0].some(v=>v===null)){alert("Isi skor lengkap Set 1 terlebih dahulu.");return}
 if(parsed[1].some(v=>v===null)&&parsed[1].some(v=>v!==null)){alert("Isi poin kedua tim pada Set 2.");return}
 if(parsed[2].some(v=>v===null)&&parsed[2].some(v=>v!==null)){alert("Isi poin kedua tim pada Set 3.");return}
 if(parsed[2].some(v=>v!==null)&&parsed[1].every(v=>v===null)){alert("Set 2 harus diisi sebelum Set 3.");return}
 const setWinners=[];
 for(let i=0;i<3;i++){
  const [a,b]=parsed[i];
  if(a===null&&b===null)continue;
  if(a===null||b===null){alert("Isi poin kedua tim pada setiap set yang dimainkan.");return}
  const target=i===2?15:25;
  const high=Math.max(a,b),low=Math.min(a,b);
  if(high<target||high-low<2){alert("Set "+(i+1)+" belum valid. Set "+(i===2?"3":"1–2")+" harus mencapai "+target+" poin dengan selisih minimal 2.");return}
  setWinners.push(a>b?"a":"b");
  if(setWinners.filter(x=>x==="a").length===2||setWinners.filter(x=>x==="b").length===2){
   if(i<2&&parsed[i+1]&&parsed[i+1].some(v=>v!==null)){alert("Set 3 hanya dimainkan jika kedua tim masing-masing menang 1 set setelah Set 2.");return}
   if(i===0&&parsed[1].some(v=>v!==null)){alert("Isi Set 2 sebelum menyimpan hasil pertandingan.");return}
   if(i===1&&parsed[2].some(v=>v!==null)){alert("Set 3 tidak diperlukan jika satu tim sudah menang 2 set.");return}
   break;
  }
 }
 const winsA=setWinners.filter(x=>x==="a").length,winsB=setWinners.filter(x=>x==="b").length;
 if(winsA<2&&winsB<2){alert("Pertandingan belum selesai. Isi skor sampai salah satu tim menang 2 set; Set 3 wajib jika hasil dua set pertama 1–1.");return}
 if(winsA===1&&winsB===1&&setWinners.length<3){alert("Kedua tim sudah berbagi 1 set. Isi skor Set 3 sampai 15 poin.");return}
 m.set1a=parsed[0][0];m.set1b=parsed[0][1];m.set2a=parsed[1][0];m.set2b=parsed[1][1];m.set3a=parsed[2][0];m.set3b=parsed[2][1];
 m.sa=winsA;m.sb=winsB;m.winner=winsA>winsB?m.a:m.b;
 let idsToSave=[id];
 if(women&&(id==="S1"||id==="S2")){
  syncWomenFinal();
  idsToSave=[id,"F"];
 }else if(!women){
  idsToSave=propagateMenResult(id);
 }
 const ok=await saveDbRows(idsToSave);
 if(!ok){alert("Skor dan perpindahan pemenang belum tersimpan ke database. Periksa koneksi Supabase lalu coba lagi.");return}
 women?renderWomen():renderMen();buildMatchSelect();loadScore(id);
 alert("Skor "+matchLabel(id)+" tersimpan. "+m.winner+" menang "+Math.max(winsA,winsB)+"–"+Math.min(winsA,winsB)+" set.");
}
async function switchMode(toWomen){
 if(women===toWomen)return;
 saveInputs();
 women=toWomen;
 modeSwitchVersion++;
 if(women)womenDraftDirty=false;
 women?initWomen():initMen();
 $("menMode").classList.toggle("active",!women);
 $("womenMode").classList.toggle("active",women);
 buildInputs();
 women?renderWomen():renderMen();
 buildMatchSelect();
 await loadDb();
 // loadDb only renders if this mode is still selected.
 buildInputs();
 women?renderWomen():renderMen();
 buildMatchSelect();
}
function setAdmin(){
 const p=prompt("Masukkan password Admin");
 if(p==="SCC2026")document.body.className="is-admin";
 else if(p!==null)alert("Password salah.");
}
$("menMode").onclick=()=>switchMode(false);
$("womenMode").onclick=()=>switchMode(true);
$("generate").onclick=generateBracket;
$("reset").onclick=async()=>{
 if(!confirm("Reset semua nama tim?"))return;
 if(women)womenTeams=Array(4).fill("");else menTeams=Array(14).fill("");
 women?initWomen():initMen();buildInputs();buildMatchSelect();women?renderWomen():renderMen();
 await saveDbRows();
};
$("matchSelect").onchange=e=>loadScore(e.target.value);
$("saveScore").onclick=saveScore;
$("adminMode").onclick=setAdmin;
document.body.className="is-tv";
initMen();buildInputs();buildMatchSelect();renderMen();loadDb();startRealtime();
})();
</script>
